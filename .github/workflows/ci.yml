name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stylua:
    name: stylua (format check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check lua scripts TESTS

  luacheck:
    name: luacheck (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Plain Lua 5.4, not LuaJIT: luacheck only needs *an* interpreter to run
      # on, and which dialect it lints for is set by `std = "luajit"` in
      # .luacheckrc — independent of the host. Pinning a LuaJIT build here buys
      # nothing and breaks when that exact tarball disappears upstream (the
      # commonly copied "luajit-2.1.0-beta3" now 404s).
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install luacheck 1.2.0
      - run: luacheck lua scripts TESTS

  tests:
    name: tests (headless nvim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: cascade.nvim
      # lib.nvim is a real runtime dependency (lib.nvim.usercmd.composer, the
      # :Cascade verb) as of the composer migration, not just a lazily
      # required optional extra -- checked out as a sibling so `rtp+=../lib.nvim`
      # matches the local dev convention documented in TESTS/README.md.
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: lib.nvim
          ref: ci-verified
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Run TESTS suite
        working-directory: cascade.nvim
        run: nvim --headless -u NONE -c "set rtp+=.,../lib.nvim" -c "luafile TESTS/run.lua" -c "qa!"
